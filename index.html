<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta id="theme-color" name="theme-color" content="#000000" />
    <meta
      name="description"
      content="ZelusX counts your push-ups and squats live from your camera, then turns every rep into levels, ranks, battles and streaks. Private, offline-first, no accounts."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZelusX" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ZelusX — Your reps are your power</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply saved theme before first paint to avoid a flash. Default: dark.
      (function () {
        try {
          var t = localStorage.getItem("rep:theme");
          var theme = t === "dark" || t === "light" ? t : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
